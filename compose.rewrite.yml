services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ai_studio_rewrite
      POSTGRES_USER: ai_studio
      POSTGRES_PASSWORD: ai_studio_local
    ports:
      - "55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ai_studio -d ai_studio_rewrite"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - rewrite-postgres:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "56379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - rewrite-redis:/data

volumes:
  rewrite-postgres:
  rewrite-redis:
